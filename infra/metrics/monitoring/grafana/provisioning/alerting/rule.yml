apiVersion: 1
groups:
  - orgId: 1
    name: system-alerts
    folder: ft-transcendence
    interval: 1m
    rules:
      - uid: cfulje7j4eebke
        title: CPU high usage
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: PBFA97CFB590B2093
            model:
              editorMode: code
              expr: >-
                (100 - (avg by(instance, job) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100))
                * on(instance) group_left(nodename)
                topk by (instance) (1, node_uname_info)
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [80]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: ["C"]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: OK
        for: 3m
        keep_firing_for: 0s
        annotations:
          summary: CPU usage is above 80%
        isPaused: false
        notification_settings:
          receiver: Discord

      - uid: cfuljip1bk0sgb
        title: Memory high usage
        condition: C
