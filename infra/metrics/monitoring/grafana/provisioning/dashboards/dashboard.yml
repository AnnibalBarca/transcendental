apiVersion: 1

providers:
  - name: 'ft-transcendence'
    orgId: 1
    folder: 'ft-transcendence'
    folderUid: 'ft-transcendence'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false