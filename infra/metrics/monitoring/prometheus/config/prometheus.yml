global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: 'resend-webhook'
    static_configs:
      - targets: ['resend-webhook:3001']
  
  - job_name: 'user_service'
    static_configs:
      - targets: ['user_service:9102']